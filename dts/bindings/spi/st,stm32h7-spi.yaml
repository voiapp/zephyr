description: |
        STM32H7 SPI controller.

        This compatible stands for all SPI hardware blocks matching the
        version available in STM32H7 SoCs.
        This version of STM32 SPI hardware block could be identified by the
        presence of a dedicated interrupt enable register (IER).
        For instance, but not limited  to: STM32MP1, STM32U5

compatible: "st,stm32h7-spi"

include: st,stm32-spi-common.yaml

properties:
  midi-clock:
    type: int
    default: 0
    description: |
      (Master Inter-Data Idleness) minimum clock inserted
      between two consecutive data frames.

  mssi-clock:
    type: int
    default: 0
    description: |
      (Master SS Idleness) minimum clock inserted between
      start and first data transaction.

  fifo-enable:
    type: boolean
    description: Enable the SPI FIFO usage for performance improvement.

  st,spi-data-width:
    default: "full-4-to-32-bit"

  fifo-size:
    type: int
    default: 16
    description: |
      SPI FIFO depth in bytes. Used to compute the FIFO threshold watermark
      for interrupt-driven transfers. Default is 16 bytes (STM32H7/H5/U5).

  fifo-max-transfer-size:
    type: int
    default: 65535
    description: |
      Maximum number of SPI frames per transfer (TSIZE register limit).
      Transfers exceeding this value will return an error. The 16-bit TSIZE
      register in STM32H7/H5-style SPI limits this to 65535.
