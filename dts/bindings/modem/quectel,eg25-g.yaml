description: Quectel EG25-G modem

compatible: "quectel,eg25-g"

include: zephyr,cellular-modem-device.yaml

properties:
  mdm-reset-gpios:
    type: phandle-array
    required: true

  mdm-dtr-gpios:
    type: phandle-array

  mdm-wdisable-gpios:
    type: phandle-array

  zephyr,mdm-reset-behavior:
    default: ["toggle_on_recovery"]

  autostarts:
    type: boolean
    description: |
      Set when the module starts automatically when supply voltage is applied,
      or when the host application manages the power-on sequence externally
      (e.g. via a board-level PWRKEY pulse before modem_cellular_init runs).
      Causes modem_cellular to skip its own power-on/reset pulse and go
      directly to AWAIT_POWER_ON.
