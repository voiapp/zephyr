description: Simcom A76XX modem

compatible: "simcom,a76xx"

include: zephyr,cellular-modem-device.yaml

properties:
  vin-supply:
    type: phandle
    description: |
      Regulator supplying the modem VIN/VBAT power rail.
      When present, the modem power management can use regulator_enable/
      regulator_disable for power sequencing instead of or in addition to
      mdm-power-gpios.

  mdm-power-gpios:
    type: phandle-array
    required: true

  autostarts:
    type: boolean
    description: |
      Set when the host application manages the power-on sequence externally
      (e.g. via a board-level PWRKEY pulse before modem_cellular_init runs).
      Causes modem_cellular to skip its own power-on pulse and go directly
      to AWAIT_POWER_ON.
